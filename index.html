<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Team map</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    html, body, #map { margin: 0; height: 100%; font-family: system-ui, sans-serif; }
    #panel {
      position: absolute; z-index: 1000; top: 12px; left: 12px; width: min(280px, calc(100vw - 24px));
      background: #fff; border-radius: 10px; padding: 12px; box-shadow: 0 2px 12px rgba(0,0,0,.18);
      display: flex; flex-direction: column; gap: 8px; max-height: calc(100vh - 24px); overflow: auto;
    }
    h1 { margin: 0; font-size: 1rem; }
    #pins { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 4px; }
    #pins button {
      width: 100%; text-align: left; border: 1px solid #e5e7eb; border-radius: 8px; padding: 8px;
      background: #fff; font: inherit; font-size: .85rem; cursor: pointer;
    }
    #pins button:hover { background: #f4f4f5; }
    .muted { color: #666; font-size: .75rem; }
  </style>
</head>
<body>
  <div id="panel">
    <h1>Team map</h1>
    <ul id="pins"></ul>
    <div class="muted">Pins live in <a href="https://github.com/ANKerD/team-map/blob/main/pins.json">pins.json</a>. Ask Cursor: “add pin for &lt;name&gt; in &lt;city&gt;”.</div>
  </div>
  <div id="map"></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    const map = L.map("map").setView([-15, -47], 4);

    // MapTiler key is restricted to allowed origins; requests from other origins get 403.
    const MAPTILER_KEY = "7CwCPzXJgwhP4wMctjV6"; // gitleaks:allow — public MapTiler browser key, origin-restricted
    const OSM_ATTR = '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>';
    const maptiler = L.tileLayer(`https://api.maptiler.com/maps/streets-v2/256/{z}/{x}/{y}.png?key=${MAPTILER_KEY}`, {
      maxZoom: 20,
      attribution: OSM_ATTR + ' &copy; <a href="https://www.maptiler.com/">MapTiler</a>',
    }).addTo(map);
    let tileErrors = 0;
    maptiler.on("tileerror", () => {
      if (++tileErrors !== 3) return;
      map.removeLayer(maptiler);
      L.tileLayer("https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png", {
        maxZoom: 20,
        subdomains: "abcd",
        attribution: OSM_ATTR + ' &copy; <a href="https://carto.com/">CARTO</a>',
      }).addTo(map);
    });

    fetch("pins.json", { cache: "no-cache" })
      .then((r) => r.json())
      .then((pins) => {
        const list = document.getElementById("pins");
        const sorted = [...pins].sort((a, b) => a.name.localeCompare(b.name));
        for (const pin of sorted) {
          const marker = L.marker([pin.lat, pin.lng]).addTo(map)
            .bindPopup(`<strong>${pin.name}</strong><br/>${pin.place || ""}`);
          const li = document.createElement("li");
          const btn = document.createElement("button");
          btn.type = "button";
          btn.innerHTML = `<strong></strong><div class="muted"></div>`;
          btn.querySelector("strong").textContent = pin.name;
          btn.querySelector(".muted").textContent = pin.place || `${pin.lat.toFixed(4)}, ${pin.lng.toFixed(4)}`;
          btn.onclick = () => { map.setView([pin.lat, pin.lng], 13); marker.openPopup(); };
          li.appendChild(btn);
          list.appendChild(li);
        }
        if (pins.length) map.fitBounds(L.latLngBounds(pins.map((p) => [p.lat, p.lng])).pad(0.25));
      });
  </script>
</body>
</html>
